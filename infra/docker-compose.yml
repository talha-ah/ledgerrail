services:
  db:
    image: postgres:18 # use the one with tag, otherwise, it doesn't work.
    restart: always
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
