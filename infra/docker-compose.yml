services:
  db:
    image: postgres:18 # use the one with tag, otherwise, it doesn't work.
    container_name: learn-postgres
    restart: always
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql

  redpanda:
    image: redpandadata/redpanda:v26.2.1
    container_name: learn-redpanda-0
    command:
      - redpanda start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --schema-registry-addr 0.0.0.0:8081
      - --rpc-addr 0.0.0.0:33145
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
    ports:
      - "9001:8081"
      - "9002:8082"
      - "19092:19092" # metadata reply - actual address to connect - package uses it automatically
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy'"]
      interval: 10s
      timeout: 5s
      retries: 5

  console:
    image: redpandadata/console:latest
    container_name: learn-redpanda-console
    command: []
    environment:
      KAFKA_BROKERS: redpanda:9092
      SCHEMA_REGISTRY_URL: http://redpanda:8081
    ports:
      - "9000:8080"
    depends_on:
      redpanda:
        condition: service_healthy

volumes:
  pgdata:
  redpanda-data:
    driver: local
